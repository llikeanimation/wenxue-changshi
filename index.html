<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="专升本文学常识填空题 293 题，点击空位揭晓答案">
<title>文学常识填空题 · 点击揭晓答案</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="toolbar">
  <button class="btn solid" id="showAll">全部揭晓</button>
  <button class="btn ghost" id="hideAll">全部隐藏</button>
  <div class="spacer"></div>
  <div class="meter">
    <span class="txt" id="progress">已揭晓 0 / 860</span>
    <span class="track"><span class="fill" id="fill"></span></span>
  </div>
</div>

<header class="hero">
  <p class="eyebrow">山东专升本 · 文学常识</p>
  <h1>文学常识填空题</h1>
  <div class="rule"></div>
  <p class="lead">共 <b>293</b> 题 · <b id="leadBlanks">860</b> 个空位　点击空位即可揭晓答案</p>
</header>

<nav class="chips" id="chips"></nav>

<main id="main"></main>

<footer>
  <div class="fline"></div>
  <div>点空揭晓 · 再点隐藏　|　点题号可一次揭晓整题</div>
</footer>

<button id="top" aria-label="回到顶部">↑</button>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
